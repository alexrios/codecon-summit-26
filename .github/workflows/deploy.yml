name: Deploy slides

on:
  push:
    branches: [main]
    paths:
      - 'slides/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout talks host
        uses: actions/checkout@v5
        with:
          path: host
      - name: Checkout spin-mutex
        uses: actions/checkout@v5
        with:
          repository: alexrios/spin-mutex
          ref: main
          path: spin-mutex
          ssh-key: ${{ secrets.SPIN_MUTEX_DEPLOY_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            host/slides/pnpm-lock.yaml
            spin-mutex/pnpm-lock.yaml
      - uses: actions/configure-pages@v5
      - name: Build Codecon Summit deck
        working-directory: host/slides
        run: |
          pnpm install --frozen-lockfile
          pnpm slidev build slides.md --base /codecon-summit-26/
      - name: Build GopherCon LATAM mutex deck in PT-BR
        working-directory: spin-mutex
        run: |
          pnpm install --frozen-lockfile
          pnpm slidev build gophercon-latam.pt-br.md \
            --base /gc-latam-26-mutex-ptbr/ \
            --router-mode hash \
            --without-notes \
            --out dist-pages
      - name: Assemble Pages site
        run: |
          mkdir -p host/slides/site/codecon-summit-26
          mkdir -p host/slides/site/gc-latam-26-mutex-ptbr
          cp -r host/slides/dist/. host/slides/site/codecon-summit-26/
          cp -r spin-mutex/dist-pages/. host/slides/site/gc-latam-26-mutex-ptbr/
          # SPA fallback: GitHub Pages serves 404.html for unknown paths like
          # /codecon-summit-26/2, letting the Slidev router take over.
          cp host/slides/dist/index.html host/slides/site/404.html
          printf '<meta http-equiv="refresh" content="0; url=/codecon-summit-26/">' > host/slides/site/index.html
          touch host/slides/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: host/slides/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
